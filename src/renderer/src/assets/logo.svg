<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="虫聊 ChongLiao">
  <title>虫聊 · ChongLiao IM（黑色线性 · 透明底）</title>
  <defs>
    <!-- 气泡主体（含左下尾巴），顺时针闭合路径 -->
    <path id="bwBubble" d="M 210 150
      H 302
      A 92 92 0 0 1 394 242
      V 314
      A 92 92 0 0 1 302 406
      H 250
      L 180 452
      L 145 379
      A 92 92 0 0 1 118 314
      V 242
      A 92 92 0 0 1 210 150 Z"/>

    <clipPath id="bwClip"><use href="#bwBubble"/></clipPath>
  </defs>

  <g fill="none" stroke="#000000" stroke-width="24"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- 翅膀（贴合气泡外侧，开放式月牙） -->
    <path stroke-width="21" d="M 205 150 C 160 98 92 90 56 126 C 22 158 22 220 50 252 C 68 272 100 274 118 262"/>
    <path stroke-width="21" d="M 307 150 C 352 98 420 90 456 126 C 490 158 490 220 462 252 C 444 272 412 274 394 262"/>
    <!-- 翅脉 -->
    <path stroke-width="15" opacity="0.45" d="M 76 136 C 64 172 68 212 90 238"/>
    <path stroke-width="15" opacity="0.45" d="M 436 136 C 448 172 444 212 422 238"/>

    <!-- 触角 -->
    <path stroke-width="19" d="M 232 152 C 228 124 218 106 206 92"/>
    <path stroke-width="19" d="M 280 152 C 284 124 294 106 306 92"/>

    <!-- 气泡主体 -->
    <use href="#bwBubble"/>

    <!-- 蜂纹（裁剪进气泡内壁） -->
    <g clip-path="url(#bwClip)" stroke-width="23">
      <path d="M 108 302 H 404"/>
      <path d="M 108 358 H 404"/>
    </g>
  </g>

  <!-- 触角端点 + 眼睛（实心态） -->
  <g fill="#000000">
    <circle cx="201" cy="84" r="13"/>
    <circle cx="311" cy="84" r="13"/>
    <circle cx="222" cy="248" r="12"/>
    <circle cx="290" cy="248" r="12"/>
  </g>
</svg>
